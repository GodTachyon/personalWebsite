baseurl: "/"
locale: "en-US"
title: "Aswath Ashok personal website"
theme: "hugo-paged"
ignoreFiles: ["\\.Rmd$", "\\.Rmarkdown$", "_cache$"]
footnotereturnlinkcontents: "↩"

outputs:
  home: [html, rss, json]

menu:
  main:
    - name: Github
      url: "https://github.com/GodTachyon"
      weight: 10
      params:
        class: [optional]

params:
  description: "A website built through Hugo with the hugo-paged theme."
  logo:
    en:
      alt: Aswath Ashok
      img: /images/logoWebsite.jpg
  footer: "[Aswath Ashok](https://www.linkedin.com/in/aswathashok/) {Year}"

security:
  allowContent: ['.*']

markup:
  highlight:
    codeFences: false
  goldmark:
    renderer:
      unsafe: true
